<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>cn-geocoding E3 demo — geocoder + MapLibre</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
  html, body { margin: 0; height: 100%; font: 14px/1.4 system-ui, sans-serif; }
  #map { position: absolute; inset: 0; }
  #status { position: absolute; bottom: 12px; left: 12px; z-index: 5; background: rgba(255,255,255,0.9);
    padding: 6px 10px; border-radius: 4px; font-size: 12px; max-width: 420px; }
  .maplibregl-ctrl .cnmw-geocoder { margin: 10px; }
</style>
<!--
  Zero-build ESM, no bundler. @cnmw/* packages resolve via this import
  map's bare specifiers to their relative source files (design doc §4.3's
  "published import map" pattern, here pointed at this repo's own
  packages/ instead of a CDN, since nothing has been published yet).
  hyparquet itself is still pulled from a pinned, exact CDN URL --
  @cnmw/geocoder-core/src/cdn.js does that internally, not this map.
-->
<script type="importmap">
{
  "imports": {
    "@cnmw/spec": "../../packages/spec/src/index.js",
    "@cnmw/geocoder-core": "../../packages/geocoder-core/src/index.js",
    "@cnmw/maplibre": "../../packages/maplibre/src/index.js"
  }
}
</script>
</head>
<body>
<div id="map"></div>
<div id="status">Loading map…</div>

<script type="module">
import { Geocoder } from '@cnmw/geocoder-core';
import { GeocoderControl } from '@cnmw/maplibre';

const statusEl = document.getElementById('status');
function setStatus(text) { statusEl.textContent = text; }

const map = new maplibregl.Map({
  container: 'map',
  style: 'https://tiles.openfreemap.org/styles/liberty',
  center: [-121.9, 37.9],
  zoom: 7,
});

const geocoder = new Geocoder({
  indexUrl: './data/index.json',
  limit: 8,
});

geocoder.on('error', (err) => setStatus(`Error: ${err.code} — ${err.message}`));
geocoder.on('load', (info) => setStatus(`Index ready: ${info.rows} places, ${info.strategy}-load, ${info.loadMs.toFixed(0)} ms.`));
geocoder.on('select', ({ result, area, elapsedMs }) => {
  setStatus(`Selected "${result.name}" (${result.country}, ADM${result.level}) — ${area.vertexCount.display} vertices, ${elapsedMs.toFixed(0)} ms.`);
});

const control = new GeocoderControl({ geocoder, placeholder: 'Search for a place…' });

// addAreaLayer (inside GeocoderControl.onAdd) calls map.addSource/addLayer,
// which MapLibre refuses until the style has finished loading -- so the
// control is only added once the map fires 'load'.
map.on('load', () => {
  map.addControl(control, 'top-left');
  setStatus('Map loaded. Type a place name, e.g. "contra costa".');
});
map.on('error', (e) => setStatus('Map style failed to load (offline?) — the geocoder still works. ' + (e?.error?.message ?? '')));

window.__cnmwDemo = { geocoder, control, map };
</script>
</body>
</html>
