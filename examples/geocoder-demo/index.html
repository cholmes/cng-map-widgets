<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>cng-map-widgets E3 demo — geocoder + MapLibre</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
  html, body { margin: 0; height: 100%; font: 14px/1.4 system-ui, sans-serif; }
  #map { position: absolute; inset: 0; }
  /* Top-right, below the ⚙ gazetteer picker: bottom-left belongs to the
     GeocoderControl's ⓘ attribution widget (and its upward-expanding
     pill), bottom-right to MapLibre's own attribution. */
  #status { position: absolute; top: 50px; right: 12px; z-index: 5; background: rgba(255,255,255,0.9);
    padding: 6px 10px; border-radius: 4px; font-size: 12px; max-width: 420px; }
  .maplibregl-ctrl .cng-geocoder { margin: 10px; }
</style>
<!--
  Zero-build ESM, no bundler. @cngeo/* packages resolve via this import
  map's bare specifiers to their relative source files (design doc §4.3's
  "published import map" pattern, here pointed at this repo's own
  packages/ instead of a CDN, since nothing has been published yet).
  hyparquet itself is still pulled from a pinned, exact CDN URL --
  @cngeo/geocoder-core/src/cdn.js does that internally, not this map.
-->
<script type="importmap">
{
  "imports": {
    "@cngeo/spec": "../../packages/spec/src/index.js",
    "@cngeo/geocoder-core": "../../packages/geocoder-core/src/index.js",
    "@cngeo/maplibre": "../../packages/maplibre/src/index.js"
  }
}
</script>
</head>
<body>
<div id="map"></div>
<div id="status">Loading map…</div>

<script type="module">
import { Geocoder } from '@cngeo/geocoder-core';
import { GeocoderControl } from '@cngeo/maplibre';
// The ⚙ gazetteer picker (top-right): switches the ?index= param between
// the three published gazetteers or a custom manifest URL, then reloads.
// A copyable zero-dependency snippet -- see ../shared/gazetteer-picker.js.
import { mountGazetteerPicker } from '../shared/gazetteer-picker.js';
mountGazetteerPicker();

const statusEl = document.getElementById('status');
function setStatus(text) { statusEl.textContent = text; }

const map = new maplibregl.Map({
  container: 'map',
  style: 'https://tiles.openfreemap.org/styles/liberty',
  center: [-121.9, 37.9],
  zoom: 7,
});

// Default to the LIVE geoboundaries-catalog manifest (data.source.coop):
// 52,398 names across all three admin levels (0, 1 AND 2 -- ADM1 did not
// exist in the provisional local build this demo originally shipped
// with). `?index=local` falls back to the local provisional build at
// ./data/index.json (ADM0+ADM2 only, no ADM1) for offline work or when
// iterating on build-data.sql/build-manifest.mjs -- see this directory's
// README/build-manifest.mjs for how to regenerate it.
const LIVE_INDEX_URL = 'https://data.source.coop/portolan-mirrors/geoboundaries-catalog/names/collection.json';
const LOCAL_INDEX_URL = './data/index.json';
// ?index=local -> the offline provisional build; ?index=<anything with a
// slash> -> that manifest URL verbatim (e.g. a locally served experimental
// catalog, like the not-yet-published cn-geocoder-overture staging tree);
// no param -> the live published geoboundaries-catalog.
const OVERTURE_INDEX_URL = 'https://data.source.coop/portolan-mirrors/cn-gazetteer-overture/names/collection.json';
// Who's On First: the live published catalog (9,478,779 names, levels 0-5).
const WOF_INDEX_URL = 'https://data.source.coop/portolan-mirrors/whosonfirst-catalog/names/collection.json';
const indexParam = new URLSearchParams(location.search).get('index');
const indexUrl = indexParam === 'local' ? LOCAL_INDEX_URL
  : indexParam === 'overture' ? OVERTURE_INDEX_URL
  : indexParam === 'wof' ? WOF_INDEX_URL
  : indexParam && indexParam.includes('/') ? indexParam
  : LIVE_INDEX_URL;

const geocoder = new Geocoder({
  indexUrl,
  limit: 8,
  // Progressive select() (design doc §1/§3.2): return the small
  // display-simplified outline immediately, then fetch+simplify the
  // full-resolution geometry in the background. This is what keeps a
  // 500K-vertex ADM0 feature (e.g. Canada) from blocking the main thread
  // at all -- the literal "Page Unresponsive" bug this demo used to hit.
  //
  // upgradeDisplay: true (design doc §1.3/§3.2 amendment, 2026-11-13) goes
  // one step further: once that background fetch lands, the *visible*
  // outline swaps to the full-resolution geometry too, not just
  // filterGeometry -- this is the actual "fetch the higher-res vectors"
  // behavior Chris asked this demo to show. GeocoderControl shows a
  // "Loading full detail… ~N vertices" notice with a Cancel button while
  // it's in flight (geocoder.cancelUpgrade() keeps the simplified outline
  // if clicked), and defers the outline swap itself to an idle callback --
  // see @cngeo/maplibre's README for why (MapLibre's GeoJSONSource#setData()
  // structured-clone cost at Canada-ADM0 scale) and this file's own
  // long-task measurement notes below.
  geometry: { resolution: 'both', upgradeDisplay: true },
});

geocoder.on('error', (err) => setStatus(`Error: ${err.code} — ${err.message}`));
geocoder.on('load', (info) => {
  const which = indexParam === 'local' ? 'local provisional' : indexParam ? 'custom' : 'LIVE';
  setStatus(`Index ready (${which}): ${info.rows} places, levels ${info.levels.join('/')}, ${info.strategy}-load, ${info.loadMs.toFixed(0)} ms.`);
});
geocoder.on('select', ({ result, area, elapsedMs }) => {
  const upgrading = area.provenance.pendingUpgrade ? ' · full detail loading…' : '';
  setStatus(`Selected "${result.name}" (${result.country}, ADM${result.level}) — outline simplified, ${area.vertexCount.display} vertices, ${elapsedMs.toFixed(0)} ms${upgrading}`);
});
geocoder.on('area:upgraded', ({ result, area, elapsedMs }) => {
  setStatus(`"${result.name}" — full detail loaded (${area.vertexCount.display} display / ${area.vertexCount.filter} filter vertices, ${elapsedMs.toFixed(0)} ms background).`);
});
geocoder.on('area:upgrade-cancelled', ({ result }) => {
  setStatus(`"${result.name}" — kept the simplified outline (upgrade cancelled).`);
});

const control = new GeocoderControl({ geocoder, placeholder: 'Search for a place…' });

// addAreaLayer (inside GeocoderControl.onAdd) calls map.addSource/addLayer,
// which MapLibre refuses until the style has finished loading -- so the
// control is only added once the map fires 'load'.
map.on('load', () => {
  map.addControl(control, 'top-left');
  setStatus('Map loaded. Type a place name, e.g. "contra costa".');
});
map.on('error', (e) => setStatus('Map style failed to load (offline?) — the geocoder still works. ' + (e?.error?.message ?? '')));

window.__cngDemo = { geocoder, control, map };
</script>
</body>
</html>
